name: RecipeApp
options:
  bundleIdPrefix: com.garybail
  developmentLanguage: ru
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"

targets:
  RecipeApp:
    type: application
    platform: iOS
    sources:
      - path: RecipeApp
    info:
      path: RecipeApp/Info.plist
      properties:
        CFBundleDisplayName: ВыборВкуса
        # Адрес сервера и можно ли менять его в профиле — см. AppConfig.swift.
        # Для App Store: VV_SERVER_URL = https://<домен>, VV_ALLOW_SERVER_OVERRIDE = NO.
        VVServerURL: $(VV_SERVER_URL)
        VVAllowServerOverride: $(VV_ALLOW_SERVER_OVERRIDE)
        # Русский язык приложения: системные кнопки («Назад»), формат цен («₽»), даты.
        CFBundleDevelopmentRegion: ru
        CFBundleLocalizations:
          - ru
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        # Разрешает http к серверу в локальной сети (для разработки).
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        # URL-схемы приложений магазинов, которые мы проверяем через canOpenURL.
        # Добавлять сюда реальные схемы, когда они будут известны (лимит Apple — 50).
        LSApplicationQueriesSchemes:
          - storea
          - storeb
          - storec
    # Вход через Apple и push. Для запуска на iPhone нужен платный Apple Developer аккаунт.
    entitlements:
      path: RecipeApp/RecipeApp.entitlements
      properties:
        com.apple.developer.applesignin:
          - Default
        aps-environment: development
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.garybail.recipeapp
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        VV_SERVER_URL: ""
        VV_ALLOW_SERVER_OVERRIDE: "YES"

  RecipeAppTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: RecipeAppTests
    dependencies:
      - target: RecipeApp
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES

  # Обход экранов со скриншотами (запускается отдельным workflow).
  RecipeAppUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: RecipeAppUITests
    dependencies:
      - target: RecipeApp
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: RecipeApp

schemes:
  RecipeAppScreenshots:
    build:
      targets:
        RecipeApp: all
        RecipeAppUITests: [test]
    test:
      targets:
        - RecipeAppUITests
  RecipeApp:
    build:
      targets:
        RecipeApp: all
        RecipeAppTests: [test]
    test:
      targets:
        - RecipeAppTests
