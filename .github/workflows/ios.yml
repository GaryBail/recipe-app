name: iOS build & tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Pick iPhone simulator
        id: sim
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -c "
          import json, sys
          devices = json.load(sys.stdin)['devices']
          for runtime, items in sorted(devices.items(), reverse=True):
              if 'iOS' not in runtime:
                  continue
              for d in items:
                  if d['name'].startswith('iPhone'):
                      print(d['udid']); sys.exit(0)
          sys.exit(1)
          ")
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"

      - name: Build and test
        shell: bash
        run: |
          set +e
          xcodebuild test \
            -project RecipeApp.xcodeproj \
            -scheme RecipeApp \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            CODE_SIGNING_ALLOWED=NO > build.log 2>&1
          status=$?
          tail -n 200 build.log
          # Ошибки компиляции и упавшие тесты — в аннотации, чтобы их было видно без логов.
          grep -E "(\.swift:[0-9]+:([0-9]+:)? error|Test Case .* failed|XCTAssert|TEST FAILED|BUILD FAILED)" build.log | grep -v CoreData | sort -u | head -40 | while IFS= read -r line; do
            echo "::error::${line//%/%25}"
          done
          exit $status
