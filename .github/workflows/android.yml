name: Android

on:
  push:
    branches: [main]
    paths: ["android/**", "RecipeApp/Resources/**", ".github/workflows/android.yml"]
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4

      - name: Build and test
        shell: bash
        run: |
          set +e
          ./gradlew --no-daemon --stacktrace :core:test :app:testDebugUnitTest :app:assembleDebug \
            2>&1 | tee build.log
          status=${PIPESTATUS[0]}
          # Ошибки компиляции и упавшие тесты — в аннотации, чтобы их было видно без логов.
          grep -E "^e: |FAILED|Could not|What went wrong|> .*Exception|AssertionError|expected:" build.log \
            | head -40 | while IFS= read -r line; do echo "::error::${line//%/%25}"; done
          exit $status
        env:
          VERSION_CODE: ${{ github.run_number }}

      - name: Test report on failure
        if: failure()
        shell: bash
        run: |
          for f in $(find . -path "*test-results*" -name "*.xml" 2>/dev/null); do
            python3 - "$f" <<'PY'
          import sys, xml.etree.ElementTree as ET
          for case in ET.parse(sys.argv[1]).getroot().iter("testcase"):
              for f in case.findall("failure"):
                  msg = (f.get("message") or "")[:400].replace("%", "%25").replace("\n", " ")
                  print(f"::error title={case.get('name')}::{msg}")
          PY
          done

      - name: Publish APK (release "android")
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk VyborVkusa.apk
          gh release view android >/dev/null 2>&1 || gh release create android --title "Android (тестовая сборка)" \
            --notes "Свежая сборка ВыборВкуса для Android. Скачайте VyborVkusa.apk на телефон и установите." --prerelease
          gh release upload android VyborVkusa.apk --clobber

  screenshots:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run walkthrough on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          working-directory: android
          # Каждая строка — отдельный shell: статус теста сохраняем в файл, чтобы забрать скриншоты и после сбоя.
          script: |
            ./gradlew --no-daemon :app:connectedDebugAndroidTest > connected.log 2>&1; echo $? > status.txt
            mkdir -p screenshots && adb pull /data/local/tmp/screens/. screenshots/ || true
            grep -E "FAILED|Exception|AssertionError|expected|not found|failed" connected.log | head -30 | sed 's/^/::error::/' || true
            test "$(cat status.txt)" = "0"
      - name: Pull screenshots after failure
        if: failure()
        working-directory: android
        run: ls screenshots 2>/dev/null || true
      - name: Publish to android-screenshots branch
        if: always()
        working-directory: android
        run: |
          [ -d screenshots ] && [ "$(ls screenshots | wc -l)" -gt 0 ] || exit 0
          cd screenshots
          git init -q -b android-screenshots
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A && git commit -qm "Android screenshots ${GITHUB_SHA::7}"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" android-screenshots
          echo "::notice title=screenshots::$(ls | tr '\n' ' ')"
