name: Backend tests

on:
  push:
    branches: [main]
    paths: ["backend/**", ".github/workflows/backend.yml"]
  pull_request:
    paths: ["backend/**", ".github/workflows/backend.yml"]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - name: pytest
        shell: bash
        run: |
          set +e
          pytest -q --tb=line -rfE 2>&1 | tee pytest.out
          status=${PIPESTATUS[0]}
          # Ошибки — в аннотации, чтобы их было видно без логов.
          grep -E "^(/|FAILED|ERROR|E )" pytest.out | head -30 | while IFS= read -r line; do
            echo "::error::${line//%/%25}"
          done
          exit $status
